name: Offline analysis tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned P2 dependencies
        run: python -m pip install -r requirements-p2.txt
      - name: Analysis tests
        run: |
          python p2/test_analysis.py
          python p2/test_analysis_rep.py
