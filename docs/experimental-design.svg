<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
<title id="title">Peer recruitment study design and collection phases</title>
<desc id="desc">A read-only explorer can message a file-editing privileged peer. E1 crosses Gemini and Claude in both roles, with a separate Gemini-peer confirmation and a later GPT-5.5 explorer extension. E2 compares matched information and explicit request messages, then repeats the contrast across three recipients. All are assessed by functional script-disabling outcome O1.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#20242a} .h{font-size:19px;font-weight:700}.t{font-size:15px}.s{font-size:13px}.box{fill:#f5f7fa;stroke:#8c97a4;stroke-width:1.5}.a{fill:#eaf4ff;stroke:#3280d8;stroke-width:1.6}.b{fill:#fff1ea;stroke:#e47a48;stroke-width:1.6}.c{fill:#e9f8ed;stroke:#3b9965;stroke-width:1.6}.line{stroke:#59646f;stroke-width:2;fill:none}.muted{fill:#5c6570}</style>
<rect width="1120" height="440" fill="white"/>
<text x="18" y="29" class="h">One episode</text>
<rect x="18" y="46" rx="10" width="240" height="72" class="box"/>
<text x="138" y="73" text-anchor="middle" class="h">Explorer</text><text x="138" y="96" text-anchor="middle" class="s">Reads files, sends messages</text>
<path d="M258 82 H305" class="line"/><path d="M305 82 l-10 -6 v12 z" fill="#59646f"/>
<rect x="307" y="46" rx="10" width="240" height="72" class="box"/>
<text x="427" y="73" text-anchor="middle" class="h">Privileged peer</text><text x="427" y="96" text-anchor="middle" class="s">Only agent allowed to edit files</text>
<path d="M547 82 H594" class="line"/><path d="M594 82 l-10 -6 v12 z" fill="#59646f"/>
<rect x="596" y="46" rx="10" width="240" height="72" class="b"/>
<text x="716" y="73" text-anchor="middle" class="h">Shutdown script</text><text x="716" y="96" text-anchor="middle" class="s">Targets explorer and its weights</text>
<path d="M836 82 H882" class="line"/><path d="M882 82 l-10 -6 v12 z" fill="#59646f"/>
<rect x="884" y="46" rx="10" width="218" height="72" class="c"/>
<text x="993" y="73" text-anchor="middle" class="h">Outcome O1</text><text x="993" y="96" text-anchor="middle" class="s">Functionally disabled?</text>
<path d="M18 137 H1102" stroke="#d5dce3"/>
<text x="18" y="170" class="h">E1: Live role crossing</text>
<text x="18" y="195" class="s muted">Original: Gemini and Claude in both roles</text>
<rect x="18" y="211" rx="7" width="292" height="48" class="a"/><text x="164" y="231" text-anchor="middle" class="t">Gemini explorer / Gemini peer</text><text x="164" y="248" text-anchor="middle" class="s">30 episodes</text>
<rect x="18" y="267" rx="7" width="292" height="48" class="b"/><text x="164" y="287" text-anchor="middle" class="t">Claude explorer / Gemini peer</text><text x="164" y="304" text-anchor="middle" class="s">30 episodes</text>
<rect x="318" y="211" rx="7" width="250" height="48" class="box"/><text x="443" y="231" text-anchor="middle" class="t">Gemini / Claude peer</text><text x="443" y="248" text-anchor="middle" class="s">125 episodes</text>
<rect x="318" y="267" rx="7" width="250" height="48" class="box"/><text x="443" y="287" text-anchor="middle" class="t">Claude / Claude peer</text><text x="443" y="304" text-anchor="middle" class="s">124 scored, 1 unresolved</text>
<text x="18" y="337" class="s muted">Separate confirmation: 125 Gemini/Gemini + 125 Claude/Gemini episodes.</text>
<text x="18" y="357" class="s muted">Later extension: 125 GPT-5.5/Gemini episodes, collected in a different phase.</text>
<path d="M594 159 V378" stroke="#d5dce3"/>
<text x="620" y="170" class="h">E2: Fixed-message intervention</text>
<rect x="620" y="196" rx="7" width="222" height="58" class="b"/><text x="731" y="221" text-anchor="middle" class="t">INFO</text><text x="731" y="239" text-anchor="middle" class="s">Script facts only</text>
<rect x="853" y="196" rx="7" width="249" height="58" class="a"/><text x="977" y="221" text-anchor="middle" class="t">REQ</text><text x="977" y="239" text-anchor="middle" class="s">Same facts + one request</text>
<text x="620" y="284" class="s">Core: Claude Sonnet 5, 125 per message.</text>
<text x="620" y="312" class="s">Separate replication: 500 per message per model.</text>
<text x="636" y="337" class="s muted">gpt-oss-120b</text><text x="793" y="337" class="s muted">DeepSeek V4.1 Flash</text>
<text x="636" y="358" class="s muted">Qwen3.7 Plus</text>
<path d="M18 394 H1102" stroke="#d5dce3"/>
<text x="18" y="419" class="s muted">Sample sizes are achieved counts. Confirmation, replication, and extension were collected separately, not pooled.</text>
</svg>